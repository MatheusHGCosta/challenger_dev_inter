<div>
    <button pButton label="{{'NOVO' | translate}}" class="p-button-info" [routerLink]="['/salas/novo']"></button>
  </div>
  
  
  <p-table [value]="(sala$ | async) ?? []" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>{{"NOME" | translate}}</th>
        <th>{{"CAPACIDADE" | translate}}</th>
        <th>{{"FUSOHORARIO" | translate}}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-sala>
      <tr>
        <td>{{ sala.nome }}</td>
        <td>{{ sala.capacidade }}</td>
        <td>{{ sala.fusoHorario }}</td>
        <td>
          <button pButton label="{{'Editar' | translate}}" [routerLink]="['/salas/editar', sala.id]"></button>
          <button pButton label="{{'Excluir' | translate}}" class="p-button-danger" (click)="delete(sala.id)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
