<div class="agendamentos-container">
  <div class="novo-agendamento">
    <button pButton label="{{'NOVO' | translate}}" class="p-button-info novo-button" [routerLink]="['/agendamentos/novo']"></button>
  </div>

  <p-table [value]="(agendamentos$ | async) ?? []" responsiveLayout="scroll" class="agendamentos-tabela">
    <ng-template pTemplate="header">
      <tr>
        <th>{{"USUARIO" | translate}}</th>
        <th>{{"SALA" | translate}}</th>
        <th>{{"INICIO" | translate}}</th>
        <th>{{"FIM" | translate}}</th>
        <th *ngIf="!idSala">{{"ACOES" | translate}}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-agendamento>
      <tr>
        <td>{{ agendamento.usuarioNome }}</td>
        <td>{{ agendamento.salaNome }}</td>
        <td>{{ agendamento.inicio | date:'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ agendamento.fim | date:'dd/MM/yyyy HH:mm' }}</td>
        <td *ngIf="!idSala" class="acoes">
          <button pButton icon="pi pi-pencil" class="p-button-success" [routerLink]="['/agendamentos/editar', agendamento.id]"></button>
          <button pButton icon="pi pi-trash" class="p-button-danger" (click)="delete(agendamento.id)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
