
<div class="login-container">
  <p-card header="Login" class="login-card">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="p-field">
        <label for="email">{{ 'Email' | translate }}</label>
        <input pInputText id="email" type="email" formControlName="email" placeholder="Digite seu e-mail">
      </div>

      <div class="p-field">
        <label for="password">{{ 'Senha' | translate }}</label>
        <input pPassword id="password" toggleMask formControlName="password" placeholder="Digite sua senha">
      </div>

      <button pButton type="submit" label="Entrar" [disabled]="loginForm.invalid" class="login-button"></button>
    </form>
  </p-card>
</div>
