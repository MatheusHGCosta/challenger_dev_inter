<header class="header">
  <div class="logo">{{ 'HOME.TITLE' | translate }}</div>
  <div class="language-selector">
    <p-dropdown 
      [options]="languages" 
      [(ngModel)]="selectedLanguage" 
      (onChange)="changeLanguage($event.value)" 
      optionLabel="label"
      placeholder="{{ 'HOME.SELECT' | translate }}">
    </p-dropdown>
  </div>
</header>
