<p-table [value]="(agendamentos$ | async) ?? []" responsiveLayout="scroll">
  <ng-template pTemplate="header">
    <tr>
      <th>{{"USUARIO" | translate}}</th>
      <th>{{"SALA" | translate}}</th>
      <th>{{"INICIO" | translate}}</th>
      <th>{{"FIM" | translate}}</th>
      <th>{{"ACOES" | translate}}</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-agendamento>
    <tr>
      <td>{{ agendamento.usuarioNome }}</td>
      <td>{{ agendamento.salaNome }}</td>
      <td>{{ agendamento.inicio | date:'dd/MM/yyyy HH:mm' }}</td>
      <td>{{ agendamento.fim | date:'dd/MM/yyyy HH:mm' }}</td>
      <td>
        <button pButton label="{{'Editar' | translate}}" [routerLink]="['/agendamentos/editar', agendamento.id]"></button>
        <button pButton label="{{'Excluir' | translate}}" class="p-button-danger" (click)="delete(agendamento.id)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
